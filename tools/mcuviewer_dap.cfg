# Horco CMSIS-DAP wireless pair -> STM32G474, live memory acquisition.
source [find interface/cmsis-dap.cfg]
transport select swd
adapter serial 132004251450
set CLOCK_FREQ 100
source [find target/stm32g4x.cfg]

bindto 127.0.0.1
gdb_port 3333
tcl_port disabled
telnet_port disabled
gdb_memory_map disable
gdb_flash_program disable

# MCUViewer reads RAM while the control firmware keeps running.
# OpenOCD's GDB handshake briefly halts the core; resume immediately, as
# recommended by MCUViewer's GDBSERVER setup. Connect only with power off.
# No reset or programming is performed.
stm32g4.cpu configure -event gdb-attach {
    if {[stm32g4.cpu curstate] eq "halted"} { resume }
}
stm32g4.cpu configure -event gdb-detach {}
